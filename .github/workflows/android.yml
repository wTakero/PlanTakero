name: Build Plans APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Créer le projet Android
        run: |
          mkdir -p app/src/main/java/com/plans/app

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PlansApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.plans.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.plans.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <application
                  android:label="Takero"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/plans/app/MainActivity.java << 'EOF'
          package com.plans.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              private static final String JS =
                  "(function(){"
                  + "if(window.__tk)return;window.__tk=1;"
                  + "var re=/apple.{0,3}(plans|maps)|(plans|maps).{0,3}beta/i;"
                  + "function fix(){"
                  + "document.querySelectorAll('img,svg').forEach(function(e){"
                  + "var p=e.parentElement;"
                  + "var t=(e.getAttribute('aria-label')||'')+' '+(e.getAttribute('alt')||'')+' '+(e.getAttribute('title')||'')+' '+(p?(p.getAttribute('aria-label')||''):'');"
                  + "if(re.test(t)&&!e.dataset.tk){"
                  + "var s=document.createElement('span');"
                  + "s.textContent='Takero';"
                  + "s.style.cssText='font:700 22px sans-serif;color:#fff';"
                  + "e.dataset.tk='1';e.style.display='none';"
                  + "e.parentNode.insertBefore(s,e);}});}"
                  + "setInterval(fix,1000);fix();"
                  + "})();";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);

                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION}, 1);
                  }

                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setUserAgentString(s.getUserAgentString().replace("; wv", ""));

                  if (Build.VERSION.SDK_INT >= 33) {
                      s.setAlgorithmicDarkeningAllowed(true);
                  } else if (Build.VERSION.SDK_INT >= 29) {
                      s.setForceDark(WebSettings.FORCE_DARK_ON);
                  }

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript(JS, null);
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin,
                              GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  if (savedInstanceState == null) {
                      web.loadUrl("https://maps.apple.com/");
                  } else {
                      web.restoreState(savedInstanceState);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Compiler
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PlansApp-apk
          path: app/build/outputs/apk/debug/app-debug.apk
